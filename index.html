<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Digital Elfahreza & Bunga</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; font-family: 'Montserrat', sans-serif; }

        /* --- STYLING SECTION 1 (PEMBUKA) --- */
        #section-1 {
            position: fixed; width: 100%; height: 100vh; z-index: 100;
            background: url('wallpaper.png') no-repeat center center; background-size: cover;
            overflow: hidden; transition: opacity 0.8s;
        }

        .dekor { position: absolute; pointer-events: none; object-fit: contain; transition: all 0.8s ease-in; }

        /* KEYFRAMES MASUK (Sesuai Layout Kamu) */
        @keyframes masukKanan { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes masukKiri { from { transform: translateX(-100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes masukBawah { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- REVERSE ANIMATION (ANIMASI KELUAR) --- */
        .keluar-kanan { transform: translateX(200px) !important; opacity: 0 !important; }
        .keluar-kiri { transform: translateX(-200px) !important; opacity: 0 !important; }
        .keluar-bawah { transform: translateY(200px) !important; opacity: 0 !important; }

        /* Tata Letak Bunga (Kunci Mati) */
        .foto-1-biru { top: 0; right: 0; width: 35%; animation: masukKanan 1s forwards; }
        .foto-2-pink { top: 20%; right: -2%; width: 30%; animation: masukKanan 1s forwards 0.2s; }
        .foto-3-hijau { bottom: 12%; right: -5px; width: 28%; animation: masukKanan 1s forwards 0.4s; }
        .foto-4-biru { bottom: 0; right: 0; width: 40%; animation: masukKanan 1s forwards 0.6s; }

        .foto-9-biru { top: 0; left: 0; width: 35%; animation: masukKiri 1s forwards; }
        .foto-8-pink { top: 20%; left: -2%; width: 30%; animation: masukKiri 1s forwards 0.2s; }
        .foto-7-hijau { bottom: 12%; left: -5px; width: 28%; animation: masukKiri 1s forwards 0.4s; }
        .foto-5-biru { bottom: 0; left: 0; width: 40%; animation: masukKiri 1s forwards 0.6s; }

        .foto-14-rumah { bottom: 2%; left: 50%; transform: translateX(-50%); width: 80%; animation: masukBawah 1s forwards; }
        .foto-10-pink-red { bottom: 5px; left: 50%; transform: translateX(-50%); width: 85%; animation: masukBawah 1.2s forwards; }
        .foto-6-biru { bottom: -5px; left: 50%; transform: translateX(-50%); width: 75%; animation: masukBawah 1.4s forwards; }

        /* Logo & Tombol */
        .content-pembuka { position: absolute; top: 48%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 110; }
        .foto-11-logo { width: 180px; margin-bottom: 20px; animation: masukBawah 1.5s forwards; }
        .btn-buka { 
            padding: 12px 35px; background: #96693d; color: white; border: none; 
            border-radius: 25px; cursor: pointer; font-weight: bold; animation: masukBawah 1.8s forwards;
        }

        /* --- SECTION 2 (HERO & AYAT) --- */
        #section-2 { display: none; background-color: #FFF3DD; }
        .hero-section {
            height: 100vh; background: url('foto_berdua.png') no-repeat center center;
            background-size: cover; background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center; text-align: center; color: white;
        }
        .hero-content { margin-top: 15vh; text-shadow: 2px 2px 10px rgba(0,0,0,0.7); }
        .hero-content h1 { font-family: 'Great Vibes', cursive; font-size: 3.8rem; margin: 10px 0; opacity: 0; }
        .reveal { animation: fadeInMove 1.5s ease-out forwards; }
        @keyframes fadeInMove { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .ayat-section { padding: 80px 30px; text-align: center; }
        .ayat-content { opacity: 0; transform: translateY(-20px); transition: 1s ease; }
        .ayat-content.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <div id="section-1">
        <img src="foto_1.png" class="dekor foto-1-biru">
        <img src="foto_2.png" class="dekor foto-2-pink">
        <img src="foto_3.png" class="dekor foto-3-hijau">
        <img src="foto_4.png" class="dekor foto-4-biru">
        <img src="foto_9.png" class="dekor foto-9-biru">
        <img src="foto_8.png" class="dekor foto-8-pink">
        <img src="foto_7.png" class="dekor foto-7-hijau">
        <img src="foto_5.png" class="dekor foto-5-biru">
        <img src="foto_10.png" class="dekor foto-10-pink-red">
        <img src="foto_14.png" class="dekor foto-14-rumah">
        <img src="foto_6.png" class="dekor foto-6-biru">

        <div class="content-pembuka" id="contentAwal">
            <img src="foto_11.png" class="dekor-logo foto-11-logo">
            <br>
            <button class="btn-buka" onclick="bukaUndangan()">BUKA UNDANGAN</button>
        </div>
    </div>

    <div id="section-2">
        <audio id="lagu" loop><source src="lagu_nikah.mp3" type="audio/mpeg"></audio>

        <section class="hero-section">
            <div class="hero-content">
                <h3 id="t1" style="font-family:'Playfair Display'; font-style:italic; opacity:0;">The Wedding of</h3>
                <h1 id="t2">Elfahreza & Bunga</h1>
                <p id="t3" style="letter-spacing:4px; opacity:0;">26 . 09 . 2027</p>
            </div>
        </section>

        <section class="ayat-section">
            <div class="ayat-content" id="ayatText">
                <p style="font-style:italic;">"Dan di antara tanda-tanda kekuasaan-Nya..."</p>
                <br><b>QS. AR-RUM: 21</b>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        function bukaUndangan() {
            // 1. Trigger Animasi Keluar (Reverse)
            document.querySelectorAll('.foto-1-biru, .foto-2-pink, .foto-3-hijau, .foto-4-biru').forEach(el => el.classList.add('keluar-kanan'));
            document.querySelectorAll('.foto-9-biru, .foto-8-pink, .foto-7-hijau, .foto-5-biru').forEach(el => el.classList.add('keluar-kiri'));
            document.querySelectorAll('.foto-14-rumah, .foto-10-pink-red, .foto-6-biru, .foto-11-logo, .btn-buka').forEach(el => el.classList.add('keluar-bawah'));

            // 2. Jeda sebentar baru ganti section
            setTimeout(() => {
                document.getElementById('section-1').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('section-1').style.display = 'none';
                    document.getElementById('section-2').style.display = 'block';
                    document.getElementById('lagu').play();
                    
                    // Animasi Nama Muncul
                    setTimeout(() => { document.getElementById('t1').classList.add('reveal'); }, 300);
                    setTimeout(() => { document.getElementById('t2').classList.add('reveal'); }, 800);
                    setTimeout(() => { document.getElementById('t3').classList.add('reveal'); }, 1300);
                }, 500);
            }, 800);
        }

        window.onscroll = function() {
            if (window.scrollY > 150) {
                document.getElementById('ayatText').classList.add('show');
            }
        };
    </script>
</body>
</html>
