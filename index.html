<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Digital A&A - Presisi Master</title>
    <style>
        /* RESET & BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Kunci layar agar dekorasi presisi saklek */
            background-color: #f0f0f0;
            font-family: 'Times New Roman', Times, serif; /* Sesuai tone klasik */
            -webkit-font-smoothing: antialiased;
        }

        /* CONTAINER UTAMA (PERSIS 1 LAYAR HP) */
        .master-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Kunci tinggi penuh layar */
            background-image: url('wallpaper.png'); /* Ini dasar banget */
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        /* STYLING UMUM UNTUK FOTO DEKORASI (1-10, 12-14) */
        .dekor {
            position: absolute;
            pointer-events: none; /* Biar gak ngalangin klik tombol */
            object-fit: contain; /* Jaga proporsi foto */
        }

        /* =========================================
           BREAKDOWN POSISI SESUAI NOMOR BEBEP
           ========================================= */

        /* Foto 12: BINGKAI (Paling Dasar dari dekorasi) */
        .foto-12-bingkai {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            object-position: top; /* Kunci di atas biar gak melorot */
            z-index: 10;
        }

        /* Foto 14: RUMAH ADAT */
        .foto-14-rumah {
            bottom: 15%; /* Atur tinggi dari bawah */
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: auto;
            max-height: 40%;
            z-index: 11;
            opacity: 0.9;
        }

        /* --- FOTO AREA ATAS --- */
        /* Foto 1: Biru Kanan Atas */
        .foto-1-biru { top: 0; right: 0; width: 35%; z-index: 30; }
        /* Foto 9: Biru Kiri Atas */
        .foto-9-biru { top: 0; left: 0; width: 35%; z-index: 30; }
        /* Foto 13: BURUNG GIF */
        .foto-13-burung { top: 15%; left: 20%; width: 60px; z-index: 12; opacity: 0.8; }

        /* --- FOTO AREA TENGAH --- */
        /* Foto 2: Pink Kanan */
        .foto-2-pink { top: 35%; right: -5%; width: 30%; z-index: 25; }
        /* Foto 8: Pink Kiri */
        .foto-8-pink { top: 35%; left: -5%; width: 30%; z-index: 25; }
        
        /* Foto 11: LOGO (A&A Emas) - INI KONTEN UTAMA */
        .foto-11-logo {
            position: relative;
            width: 200px; /* Lebar Logo */
            height: auto;
            margin-bottom: 20px;
        }

        /* Container untuk Logo & Tombol agar Flexibel di Tengah */
        .main-content {
            position: absolute;
            top: 45%; /* Posisi Vertikal Tengah */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100; /* Paling depan */
            text-align: center;
        }

        /* Tombol Buka Undangan */
        .btn-buka {
            background-color: #96693d; /* Warna Coklat */
            color: white;
            padding: 12px 35px;
            border-radius: 25px;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s ease;
        }
        .btn-buka:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.4); }

        /* --- FOTO AREA BAWAH SINKING --- */
        /* Foto 3: Hijau Kanan */
        .foto-3-hijau { bottom: 10%; right: 0; width: 40%; z-index: 30; }
        /* Foto 7: Hijau Kiri */
        .foto-7-hijau { bottom: 10%; left: 0; width: 40%; z-index: 30; }

        /* --- FOTO AREA PALING DASAR (FLOOR) --- */
        /* Foto 4: Biru Kanan Bawah */
        .foto-4-biru { bottom: 0; right: 0; width: 35%; z-index: 40; }
        /* Foto 5: Biru Kiri Bawah */
        .foto-5-biru { bottom: 0; left: 0; width: 35%; z-index: 40; }
        /* Foto 6: Biru Tengah Bawah */
        .foto-6-biru { bottom: 0; left: 50%; transform: translateX(-50%); width: 60%; z-index: 41; }
        
        /* Foto 10: Pink Kemerahan Tengah (Sesuai coretan merah) */
        .foto-10-pink-red { 
            bottom: 5px; /* Sedikit diangkat biar gabung */
            left: 50%; 
            transform: translateX(-50%); 
            width: 75%; 
            z-index: 35; /* Di belakang Foto 6 tapi di depan rumah */
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="master-container">
        <img src="foto_12.png" class="dekor foto-12-bingkai" alt="12">

        <img src="foto_13.gif" class="dekor foto-13-burung" alt="13">

        <img src="foto_14.png" class="dekor foto-14-rumah" alt="14">

        <img src="foto_2.png" class="dekor foto-2-pink" alt="2">
        <img src="foto_8.png" class="dekor foto-8-pink" alt="8">
        <img src="foto_10.png" class="dekor foto-10-pink-red" alt="10">

        <img src="foto_1.png" class="dekor foto-1-biru" alt="1">
        <img src="foto_9.png" class="dekor foto-9-biru" alt="9">

        <img src="foto_3.png" class="dekor foto-3-hijau" alt="3">
        <img src="foto_7.png" class="dekor foto-7-hijau" alt="7">

        <img src="foto_4.png" class="dekor foto-4-biru" alt="4">
        <img src="foto_5.png" class="dekor foto-5-biru" alt="5">
        <img src="foto_6.png" class="dekor foto-6-biru" alt="6">

        <div class="main-content">
            <img src="foto_11.png" class="foto-11-logo" alt="11">
            <a href="#" class="btn-buka">Buka Undangan</a>
        </div>

    </div>

</body>
</html>
